name: Pages

on:
  push:
    branches: [main]
  # Daily, so the hosted README cards in /cards stay fresh.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - id: pages
        uses: actions/configure-pages@v5

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Works for a project site (user.github.io/repo), a user site, or a custom domain.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # These logins get a prerendered profile page, so their links answer 200 and unfurl with a preview.
          SNAPSHOT_USERS: ${{ vars.SNAPSHOT_USERS || github.repository_owner }}

      # Pre-rendered cards with a stable URL, for READMEs. Set the SNAPSHOT_USERS repository variable to a
      # comma-separated list of logins to publish more than the repository owner.
      - name: Hosted card snapshots
        run: pnpm cards --users "${{ vars.SNAPSHOT_USERS || github.repository_owner }}" --out dist/cards
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
